  <rect x="3" y="3" width="58" height="58" rx="2" stroke="#E65A36" stroke-width="2"/>
  <!-- Technical Precision Corner Ticks -->
  <line x1="8" y1="8" x2="14" y2="8" stroke="#E65A36" stroke-width="1.5"/>
  <line x1="8" y1="8" x2="8" y2="14" stroke="#E65A36" stroke-width="1.5"/>
  <line x1="56" y1="56" x2="50" y2="56" stroke="#E65A36" stroke-width="1.5"/>
  <line x1="56" y1="56" x2="56" y2="50" stroke="#E65A36" stroke-width="1.5"/>
